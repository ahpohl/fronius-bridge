name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-24.04   # pin: avoids surprises if ubuntu-latest moves to 26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Add GCC 16 toolchain PPA
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

      - name: Add PostgreSQL (PGDG) apt repo
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-16 g++-16 \
            cmake \
            ninja-build \
            pkg-config \
            libmodbus-dev \
            libmosquitto-dev \
            libyaml-cpp-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libcli11-dev \
            libpq-dev

      # Build the library from master instead of installing the latest
      # released deb. This job is the canary for library API changes: an
      # incompatible change lands here on the commit that introduces it,
      # rather than staying invisible until the next libfronius release is
      # published. release.yml and docker.yml stay pinned to a tag on
      # purpose -- a published artifact has to be reproducible.
      #
      # Not a shallow clone: the library takes its version from git describe
      # and silently falls back to 0.0.0 without the tag history, which would
      # give the .so a SOVERSION of 0.
      - name: Build and install libfronius from master
        env:
          CC: gcc-16
          CXX: g++-16
        run: |
          git clone --branch master https://github.com/ahpohl/libfronius.git \
            /tmp/libfronius
          cmake -S /tmp/libfronius -B /tmp/libfronius/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/libfronius/build
          sudo cmake --install /tmp/libfronius/build
          sudo ldconfig

      - name: Configure (Ninja)
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 2
